syntax = "proto3";

package cogniboiler;

// ─── Enums ───────────────────────────────────────────────────────────────────

enum SensorQuality {
  GOOD = 0;
  UNCERTAIN = 1;
  BAD = 2;
}

enum CommandSource {
  OPERATOR = 0;
  PID = 1;
  SAFETY = 2;
  SCHEDULER = 3;
}

enum ControlMode {
  AUTO = 0;
  MANUAL = 1;
  ESTOP = 2;
}

enum SimulationRunState {
  SIMULATION_RUNNING = 0;
  SIMULATION_PAUSED = 1;
}

enum FaultKind {
  FAULT_KIND_UNSPECIFIED = 0;
  FAULT_BURNER_FOULING = 1; // severity: fraction of combustion efficiency lost
  FAULT_STEAM_LEAK = 2; // severity: leak flow as a fraction of rated steam flow
  FAULT_FEEDWATER_PUMP_FAILURE = 3; // severity: fraction of pump capacity lost
  FAULT_VALVE_STUCK = 4; // target: fuel | feedwater | steam | spray
  FAULT_SENSOR_DRIFT = 5; // target: sensor id; severity: fraction of span per minute
  FAULT_SENSOR_FAILURE = 6; // target: sensor id
}

// ─── Core messages ───────────────────────────────────────────────────────────

message Empty {}

message HealthStatus {
  string service = 1;
  string status = 2; // "running" | "degraded" | "stopped"
  string version = 3;
  double uptime_seconds = 4;
}

// ─── Sensor / State messages ──────────────────────────────────────────────────

// Values are as the instruments report them: a faulty sensor shows here.
message BoilerStateMsg {
  double pressure_pa = 1; // Drum pressure [Pa]
  double water_level_m = 2; // Water level in drum [m]
  double water_temp_k = 3; // Bulk water temperature [K]
  double flue_gas_temp_k = 4; // Flue gas temperature [K]
  double internal_energy_j = 5; // Total internal energy [J]
  int64 timestamp_ms = 6; // UTC epoch milliseconds
  SensorQuality quality = 7; // worst quality of the boiler instruments
  double fuel_flow_kg_s = 8;
  double feedwater_flow_kg_s = 9;
  double drum_steam_flow_kg_s = 10;
  double spray_flow_kg_s = 11;
  double superheater_outlet_temp_k = 12; // before attemperator spray
  double economizer_outlet_temp_k = 13;
  double stack_temp_k = 14;
  double heat_release_w = 15;
  double boiler_efficiency = 16; // heat to water and steam over fuel LHV, 0..1
  double feedwater_temp_k = 17;
  double relief_flow_kg_s = 18; // discharged by the drum safety valves
}

message TurbineStateMsg {
  double electrical_power_w = 1; // Net electrical output [W]
  double shaft_power_w = 2; // Mechanical shaft power [W]
  double enthalpy_in_j_kg = 3; // Inlet specific enthalpy [J/kg]
  double enthalpy_out_j_kg = 4; // Outlet specific enthalpy [J/kg]
  double exhaust_pressure_pa = 5; // Condenser pressure [Pa]
  double steam_flow_kg_s = 6; // Steam mass flow [kg/s]
  int64 timestamp_ms = 7;
  double steam_temp_in_k = 8; // Turbine inlet steam temperature [K]
  double exhaust_temp_k = 9;
}

message ActuatorStateMsg {
  double fuel_valve_command = 1;
  double fuel_valve_position = 2;
  double feedwater_valve_command = 3;
  double feedwater_valve_position = 4;
  double steam_valve_command = 5;
  double steam_valve_position = 6;
  double spray_valve_command = 7;
  double spray_valve_position = 8;
}

message EmissionsMsg {
  double co2_kg_s = 1;
  double nox_kg_s = 2;
  double co_kg_s = 3;
  double nox_ppmv = 4;
  double co2_intensity_kg_per_mwh = 5; // per MWh of electricity; 0 when not generating
}

message CondenserMsg {
  double backpressure_pa = 1;
  double condensate_temp_k = 2;
  double cooling_water_temp_in_k = 3;
  double cooling_water_temp_out_k = 4;
  double heat_rejected_w = 5;
  double loading = 6; // fraction of design heat duty
}

message EquipmentHealthMsg {
  double turbine_hours = 1;
  double turbine_starts = 2;
  double turbine_damage = 3; // Miner damage fraction, 1.0 = design life used
  double boiler_tube_hours = 4;
  double boiler_tube_damage = 5;
  double pump_hours = 6;
  double overall_health_pct = 7;
  bool maintenance_alarm = 8;
  bool maintenance_critical = 9;
}

message SensorStatusMsg {
  string sensor_id = 1;
  SensorQuality quality = 2;
  double measured_value = 3; // SI units of the instrument
}

// An active fault, labelled so that recorded runs can serve as training data.
message FaultMsg {
  string fault_id = 1;
  FaultKind kind = 2;
  string target = 3;
  double severity = 4;
  double ramp_s = 5;
  double started_at_s = 6; // simulation time
  double intensity = 7; // 0 at onset, 1 once fully developed
  string label = 8; // e.g. "sensor_drift:drum_level"
}

message SimulationStatusMsg {
  SimulationRunState run_state = 1;
  double speed_factor = 2;
  double simulation_time_s = 3;
  int64 step_count = 4;
  string scenario = 5;
  int64 run_id = 6; // changes whenever a scenario is (re)loaded
  double step_s = 7;
}

message SystemStateMsg {
  BoilerStateMsg boiler = 1;
  TurbineStateMsg turbine = 2;
  ActuatorStateMsg actuators = 3;
  double simulation_time_s = 4;
  EmissionsMsg emissions = 5;
  CondenserMsg condenser = 6;
  EquipmentHealthMsg health = 7;
  repeated FaultMsg active_faults = 8;
  repeated SensorStatusMsg sensors = 9;
  SimulationStatusMsg simulation = 10;
}

// Published on sensors/plant alongside sensors/boiler and sensors/turbine.
message PlantStatusMsg {
  EmissionsMsg emissions = 1;
  CondenserMsg condenser = 2;
  EquipmentHealthMsg health = 3;
  repeated FaultMsg active_faults = 4;
  repeated SensorStatusMsg sensors = 5;
  SimulationStatusMsg simulation = 6;
  ActuatorStateMsg actuators = 7;
  int64 timestamp_ms = 8;
}

// ─── Control messages ─────────────────────────────────────────────────────────

message ControlCommandMsg {
  double fuel_valve = 1; // 0.0 – 1.0
  double feedwater_valve = 2; // 0.0 – 1.0
  double steam_valve = 3; // 0.0 – 1.0
  int64 timestamp_ms = 4;
  CommandSource source = 5;
  string operator_id = 6; // empty if automated
  optional double spray_valve = 7; // 0.0 – 1.0; unset keeps the current spray command
}

message SetpointsMsg {
  double pressure_pa = 1; // Target drum pressure [Pa]
  double water_level_m = 2; // Target water level [m]
  double steam_temp_k = 3; // Target steam temperature [K]
  int64 timestamp_ms = 4;
  string operator_id = 5; // who changed them; empty in responses
}

message CommandAck {
  bool accepted = 1;
  string reason = 2; // rejection reason if !accepted
  int64 timestamp_ms = 3;
}

message ResetRequest {
  string operator_id = 1;
}

message SafetyEventMsg {
  int64 timestamp_ms = 1;
  string parameter = 2;
  double value = 3;
  double threshold = 4;
  string level = 5;
  string action = 6;
}

// One control loop at the end of the latest AUTO scan.
message ControlLoopMsg {
  string name = 1; // load | pressure | fuel_flow | drum_level | feedwater_flow | steam_temp
  double setpoint = 2; // working (ramped) setpoint
  double measurement = 3;
  double output = 4; // valve position or the demand passed to the inner loop
  string unit = 5; // unit of setpoint and measurement
}

// An alarm condition the PLC currently detects.
message AlarmConditionMsg {
  string key = 1; // plc-controller:<parameter>:<high|low>:<warning|critical>
  string parameter = 2;
  string severity = 3; // warning | critical
  string direction = 4; // high | low
  double value = 5;
  double threshold = 6;
  string message = 7;
  int64 since_ms = 8;
}

message PLCStatusMsg {
  ControlMode mode = 1;
  bool emergency_stop_active = 2;
  SetpointsMsg setpoints = 3; // targets
  ControlCommandMsg latest_command = 4;
  int64 warning_count = 5;
  int64 trip_count = 6;
  SafetyEventMsg active_trip = 7; // cause of the latched trip; empty when not latched
  double load_demand_w = 8; // operator's target
  double load_setpoint_w = 9; // ramped working setpoint
  SetpointsMsg active_setpoints = 10; // ramped working setpoints
  bool reset_permitted = 11;
  repeated string reset_blockers = 12; // why a reset would be refused now
  repeated AlarmConditionMsg active_conditions = 13;
  repeated ControlLoopMsg loops = 14;
  int64 run_id = 15; // plant run the PLC is following
}

message LoadDemandRequest {
  double load_w = 1; // electrical load target [W]
  string operator_id = 2;
}

message ControlModeRequest {
  ControlMode mode = 1; // AUTO | MANUAL | ESTOP (a manual trip)
  string operator_id = 2;
}

// ─── Simulation control messages ──────────────────────────────────────────────

message SimulationControlRequest {
  string operator_id = 1;
}

message SimulationSpeedRequest {
  double speed_factor = 1;
  string operator_id = 2;
}

message StepRequest {
  int32 steps = 1; // only while paused
  string operator_id = 2;
}

message ScenarioMsg {
  string name = 1;
  string title = 2;
  string description = 3;
}

message ScenarioListMsg {
  repeated ScenarioMsg scenarios = 1;
  string current = 2;
}

message ScenarioRequest {
  string name = 1;
  string operator_id = 2;
}

message SimulationAck {
  bool accepted = 1;
  string reason = 2;
  int64 timestamp_ms = 3;
  SimulationStatusMsg status = 4;
}

message FaultRequest {
  FaultKind kind = 1;
  string target = 2;
  double severity = 3;
  double ramp_s = 4; // seconds of simulation time to full severity
  string operator_id = 5;
}

message FaultClearRequest {
  string fault_id = 1;
  bool all = 2; // clear every active fault; fault_id is ignored
  string operator_id = 3;
}

message FaultAck {
  bool accepted = 1;
  string reason = 2;
  int64 timestamp_ms = 3;
  repeated FaultMsg faults = 4; // injected or cleared faults
}

// ─── Alarm messages ───────────────────────────────────────────────────────────

enum AlarmState {
  ALARM_STATE_UNSPECIFIED = 0;
  ALARM_ACTIVE_UNACK = 1;
  ALARM_ACTIVE_ACK = 2;
  ALARM_CLEARED_UNACK = 3; // returned to normal, not yet acknowledged
  ALARM_CLEARED = 4; // closed
}

message AlarmMsg {
  int64 alarm_id = 1;
  string key = 2; // condition identity, e.g. plc-controller:water_level_m:low:critical
  string source_service = 3;
  string parameter = 4;
  string severity = 5; // warning | critical
  string direction = 6; // high | low
  string unit = 7;
  AlarmState state = 8;
  string message = 9;
  string action = 10;
  string topic = 11;
  double value = 12; // latest value [unit]
  double threshold = 13; // [unit]
  int64 raised_at_ms = 14;
  int64 cleared_at_ms = 15; // 0 while active
  int64 acknowledged_at_ms = 16; // 0 while unacknowledged
  string acknowledged_by = 17;
  string ack_comment = 18;
  int32 occurrence_count = 19; // times the condition became active in this alarm
  int64 updated_at_ms = 20;
}

message AlarmTransitionMsg {
  int64 transition_id = 1;
  int64 alarm_id = 2;
  AlarmState from_state = 3; // unspecified for the activation that opened the alarm
  AlarmState to_state = 4;
  int64 at_ms = 5;
  string actor = 6; // source service or the person who acknowledged
  string comment = 7;
  double value = 8;
}

message ListAlarmsRequest {
  bool open_only = 1; // not yet both cleared and acknowledged
  string severity = 2; // empty for all
  string parameter = 3; // empty for all
  int64 from_ms = 4; // raised at or after; 0 for no bound
  int64 to_ms = 5; // raised at or before; 0 for no bound
  int32 limit = 6; // 1..1000, default 100
  int32 offset = 7;
}

message AlarmListMsg {
  repeated AlarmMsg alarms = 1;
  int32 total = 2; // matching alarms before limit and offset
}

message AlarmRef {
  int64 alarm_id = 1;
}

message AlarmDetailMsg {
  AlarmMsg alarm = 1;
  repeated AlarmTransitionMsg transitions = 2;
}

message AcknowledgeAlarmRequest {
  int64 alarm_id = 1;
  string operator_id = 2;
  string comment = 3;
}

message AcknowledgeAllRequest {
  string operator_id = 1;
  string comment = 2;
  string severity = 3; // empty for every unacknowledged alarm
}

message AcknowledgeResult {
  bool accepted = 1;
  string reason = 2;
  int64 timestamp_ms = 3;
  repeated AlarmMsg alarms = 4; // the acknowledged alarms
}

// ─── Streaming ────────────────────────────────────────────────────────────────

message StreamRequest {
  double interval_s = 1; // Desired update interval [s], 0 = max rate
}

// ─── gRPC Services ───────────────────────────────────────────────────────────

// PLCService: receives high-level commands, validates, applies to physics engine
service PLCService {
  rpc Health(Empty) returns (HealthStatus);
  rpc SendCommand(ControlCommandMsg) returns (CommandAck);
  rpc GetSetpoints(Empty) returns (SetpointsMsg);
  rpc UpdateSetpoints(SetpointsMsg) returns (CommandAck);
  rpc GetControlStatus(Empty) returns (PLCStatusMsg);
  rpc ResetEmergencyStop(ResetRequest) returns (CommandAck);
  rpc StreamCommands(StreamRequest) returns (stream ControlCommandMsg);
  rpc SetLoadDemand(LoadDemandRequest) returns (CommandAck);
  rpc SetControlMode(ControlModeRequest) returns (CommandAck);
}

// PhysicsService: owns the live process state and applies validated commands.
service PhysicsService {
  rpc Health(Empty) returns (HealthStatus);
  rpc GetSystemState(Empty) returns (SystemStateMsg);
  rpc StreamSystemState(StreamRequest) returns (stream SystemStateMsg);
  rpc ApplyControlCommand(ControlCommandMsg) returns (CommandAck);

  rpc GetSimulationStatus(Empty) returns (SimulationStatusMsg);
  rpc PauseSimulation(SimulationControlRequest) returns (SimulationAck);
  rpc ResumeSimulation(SimulationControlRequest) returns (SimulationAck);
  rpc SetSimulationSpeed(SimulationSpeedRequest) returns (SimulationAck);
  rpc StepSimulation(StepRequest) returns (SimulationAck);
  rpc ListScenarios(Empty) returns (ScenarioListMsg);
  rpc LoadScenario(ScenarioRequest) returns (SimulationAck);
  rpc InjectFault(FaultRequest) returns (FaultAck);
  rpc ClearFault(FaultClearRequest) returns (FaultAck);
}

// AlarmService: alarm lifecycle owned by alert-manager.
service AlarmService {
  rpc Health(Empty) returns (HealthStatus);
  rpc ListAlarms(ListAlarmsRequest) returns (AlarmListMsg);
  rpc GetAlarm(AlarmRef) returns (AlarmDetailMsg);
  rpc AcknowledgeAlarm(AcknowledgeAlarmRequest) returns (AcknowledgeResult);
  rpc AcknowledgeAll(AcknowledgeAllRequest) returns (AcknowledgeResult);
}
