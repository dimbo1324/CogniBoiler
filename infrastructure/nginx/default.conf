# The console and the gateway on one origin: the console's static build, and the gateway's
# public routes proxied to api-gateway. The gateway's /metrics and anything not listed here
# stay inside the Compose network. A TLS server with the same locations is written into
# /tmp/cogniboiler-nginx by 40-cogniboiler-tls.sh when a certificate is configured, so the
# image's own configuration can stay read-only.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# The console needs no inline script or style. The API documentation pages load Swagger UI
# and ReDoc from jsDelivr at the exact versions and with the integrity hashes site.inc
# writes into them, and only those files are allowed.
map $uri $cogniboiler_csp {
    default "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
    ~^/(docs|redoc)$ "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.33.0/swagger-ui-bundle.js https://cdn.jsdelivr.net/npm/redoc@2.5.4/bundles/redoc.standalone.js; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.33.0/swagger-ui.css; img-src 'self' data: https://fastapi.tiangolo.com https://cdn.redoc.ly; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
}

# HSTS applies to every port of a host name, so it is never sent for a loopback name: a
# trusted self-signed certificate on localhost would otherwise force HTTPS on Grafana,
# Prometheus and the Vite dev server for a year. An empty value sends no header.
map $host $cogniboiler_hsts {
    default     "max-age=31536000";
    localhost   "";
    127.0.0.1   "";
    "[::1]"     "";
}

upstream gateway {
    server api-gateway:8000;
}

server {
    listen 8080;
    server_name _;
    include /etc/nginx/cogniboiler/site.inc;
}

include /tmp/cogniboiler-nginx/*.conf;
