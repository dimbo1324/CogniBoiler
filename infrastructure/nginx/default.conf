# The console and the gateway on one origin: the console's static build, and the gateway's
# public routes proxied to api-gateway. The gateway's /metrics and anything not listed here
# stay inside the Compose network. A TLS server with the same locations is added by
# 40-cogniboiler-tls.sh when a certificate is configured.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

upstream gateway {
    server api-gateway:8000;
}

server {
    listen 8080;
    server_name _;
    include /etc/nginx/cogniboiler/site.inc;
}
