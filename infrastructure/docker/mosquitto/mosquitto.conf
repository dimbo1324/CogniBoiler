# Mosquitto for the CogniBoiler stack. Every client signs in with its own account and may
# touch only the topics the ACL grants it; nothing is anonymous. The password file is
# written from .env by start-broker.sh on every start and never stored in the repository.
# The browser never speaks MQTT, so there is no WebSocket listener.

listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/auth/passwd
acl_file /mosquitto/auth/acl

# Messages survive a broker restart.
persistence true
persistence_location /mosquitto/data/

# Standard output only: Docker rotates it (docker-compose.yml, x-docker-logs).
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Maximum QoS 1 and 2 messages in flight, and queued, per client.
max_inflight_messages 100
max_queued_messages 1000

# Every payload on the contract is a small protobuf or JSON message; the limits only stop a
# signed-in client from sending huge packets or opening connections without bound.
max_packet_size 262144
max_connections 64
