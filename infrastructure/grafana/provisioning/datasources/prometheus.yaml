apiVersion: 1

# The Platform dashboard reads service metrics through this fixed uid. Prometheus runs in
# the `observability` profile; without it these panels show no data.
deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
    jsonData:
      timeInterval: 10s
    editable: true
