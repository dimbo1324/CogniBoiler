# Scrapes every CogniBoiler service on the Compose network. Each job is named after its
# service, so dashboards group by `job`. Started with the `observability` profile.
global:
  scrape_interval: 10s
  scrape_timeout: 5s
  evaluation_interval: 10s

scrape_configs:
  - job_name: api-gateway
    static_configs:
      - targets: ["api-gateway:8000"]
  - job_name: physics-engine
    static_configs:
      - targets: ["physics-engine:9100"]
  - job_name: plc-controller
    static_configs:
      - targets: ["plc-controller:9100"]
  - job_name: historian
    static_configs:
      - targets: ["historian:9100"]
  - job_name: alert-manager
    static_configs:
      - targets: ["alert-manager:9100"]
  - job_name: opcua-server
    static_configs:
      - targets: ["opcua-server:9100"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
