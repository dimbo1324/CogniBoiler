# The whole platform on one machine. Secrets come from .env, created by:
#   python dev_tools_scripts_runner.py dev-secrets
# Start with:  python dev_tools_scripts_runner.py stack up
# InfluxDB and PostgreSQL read their credentials only on first start: after regenerating
# secrets, recreate the volumes with `stack down --volumes`.
name: cogniboiler

x-python-service: &python-service
  build:
    context: .
    dockerfile: Dockerfile
  image: cogniboiler/services:dev
  restart: unless-stopped

services:
  # Every client has its own account and topic rights; the accounts are written from .env
  # on each start by start-broker.sh.
  mosquitto:
    image: eclipse-mosquitto:2.0
    entrypoint: ["/bin/sh", "/cogniboiler/start-broker.sh"]
    ports:
      - "127.0.0.1:1883:1883"
    environment:
      MQTT_PHYSICS_ENGINE_PASSWORD: ${MQTT_PHYSICS_ENGINE_PASSWORD:?run dev-secrets}
      MQTT_PLC_CONTROLLER_PASSWORD: ${MQTT_PLC_CONTROLLER_PASSWORD:?run dev-secrets}
      MQTT_ALERT_MANAGER_PASSWORD: ${MQTT_ALERT_MANAGER_PASSWORD:?run dev-secrets}
      MQTT_HISTORIAN_PASSWORD: ${MQTT_HISTORIAN_PASSWORD:?run dev-secrets}
      MQTT_API_GATEWAY_PASSWORD: ${MQTT_API_GATEWAY_PASSWORD:?run dev-secrets}
      MQTT_OPCUA_SERVER_PASSWORD: ${MQTT_OPCUA_SERVER_PASSWORD:?run dev-secrets}
      MQTT_MONITOR_PASSWORD: ${MQTT_MONITOR_PASSWORD:?run dev-secrets}
    volumes:
      - ./infrastructure/docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infrastructure/docker/mosquitto/acl:/cogniboiler/acl:ro
      - ./infrastructure/docker/mosquitto/start-broker.sh:/cogniboiler/start-broker.sh:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -u monitor -P \"$$MQTT_MONITOR_PASSWORD\" -t '$$SYS/broker/uptime' -C 1 -i healthcheck -W 3"]
      interval: 10s
      timeout: 5s
      retries: 5

  influxdb:
    image: influxdb:2.7
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_ADMIN_USER:?run dev-secrets}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD:?run dev-secrets}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:?run dev-secrets}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:?run dev-secrets}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_ADMIN_TOKEN:?run dev-secrets}
      DOCKER_INFLUXDB_INIT_RETENTION: 90d
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgresql:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?run dev-secrets}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run dev-secrets}
      POSTGRES_DB: ${POSTGRES_DB:?run dev-secrets}
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?run dev-secrets}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run dev-secrets}
      GF_USERS_ALLOW_SIGN_UP: "false"
      INFLUXDB_ORG: ${INFLUXDB_ORG:?run dev-secrets}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:?run dev-secrets}
      INFLUXDB_ADMIN_TOKEN: ${INFLUXDB_ADMIN_TOKEN:?run dev-secrets}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    <<: *python-service
    # The only service that connects as the owner of the tables: it migrates the schema and
    # gives the application roles their passwords.
    command: ["sh", "-c", "python -m alembic -c apps/api-gateway/alembic.ini upgrade head && python -m api_gateway.db_roles"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?run dev-secrets}:${POSTGRES_PASSWORD:?run dev-secrets}@postgresql:5432/${POSTGRES_DB:?run dev-secrets}
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD:?run dev-secrets}
      ALARMS_DB_PASSWORD: ${ALARMS_DB_PASSWORD:?run dev-secrets}
    depends_on:
      postgresql:
        condition: service_healthy
    restart: "no"

  physics-engine:
    <<: *python-service
    command: ["python", "-m", "physics_engine", "--mqtt-host", "mosquitto", "--grpc-port", "50052", "--metrics-port", "9100", "--metrics-host", "0.0.0.0"]
    environment:
      MQTT_USERNAME: physics-engine
      MQTT_PASSWORD: ${MQTT_PHYSICS_ENGINE_PASSWORD:?run dev-secrets}
    depends_on:
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc, cogniboiler_pb2 as p, cogniboiler_pb2_grpc as g; g.PhysicsServiceStub(grpc.insecure_channel('localhost:50052')).Health(p.Empty(), timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  plc-controller:
    <<: *python-service
    command: ["python", "-m", "plc_controller", "--port", "50051", "--physics-target", "physics-engine:50052", "--mqtt-host", "mosquitto", "--mqtt-port", "1883", "--metrics-port", "9100", "--metrics-host", "0.0.0.0"]
    environment:
      MQTT_USERNAME: plc-controller
      MQTT_PASSWORD: ${MQTT_PLC_CONTROLLER_PASSWORD:?run dev-secrets}
    depends_on:
      mosquitto:
        condition: service_healthy
      physics-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc, cogniboiler_pb2 as p, cogniboiler_pb2_grpc as g; g.PLCServiceStub(grpc.insecure_channel('localhost:50051')).Health(p.Empty(), timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  historian:
    <<: *python-service
    command: ["python", "-m", "historian", "--mqtt-host", "mosquitto", "--influx-url", "http://influxdb:8086", "--influx-org", "${INFLUXDB_ORG:?run dev-secrets}", "--influx-bucket", "${INFLUXDB_BUCKET:?run dev-secrets}", "--batch-size", "50", "--flush-interval-s", "2.0", "--liveness-file", "/tmp/cogniboiler-liveness", "--metrics-port", "9100", "--metrics-host", "0.0.0.0"]
    environment:
      MQTT_USERNAME: historian
      MQTT_PASSWORD: ${MQTT_HISTORIAN_PASSWORD:?run dev-secrets}
      INFLUXDB_TOKEN: ${INFLUXDB_ADMIN_TOKEN:?run dev-secrets}
    depends_on:
      mosquitto:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "historian.liveness", "/tmp/cogniboiler-liveness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  alert-manager:
    <<: *python-service
    command: ["python", "-m", "alert_manager", "--mqtt-host", "mosquitto", "--mqtt-port", "1883", "--grpc-port", "50053", "--liveness-file", "/tmp/cogniboiler-liveness", "--metrics-port", "9100", "--metrics-host", "0.0.0.0"]
    environment:
      MQTT_USERNAME: alert-manager
      MQTT_PASSWORD: ${MQTT_ALERT_MANAGER_PASSWORD:?run dev-secrets}
      ALERT_MANAGER_DATABASE_URL: postgresql+asyncpg://cogniboiler_alarms:${ALARMS_DB_PASSWORD:?run dev-secrets}@postgresql:5432/${POSTGRES_DB:?run dev-secrets}
    depends_on:
      mosquitto:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "alert_manager.liveness", "/tmp/cogniboiler-liveness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  opcua-server:
    <<: *python-service
    command: ["python", "-m", "opcua_server", "--mqtt-host", "mosquitto", "--plc-target", "plc-controller:50051", "--alarm-target", "alert-manager:50053", "--gateway-url", "http://api-gateway:8000", "--opc-port", "4840", "--metrics-port", "9100", "--metrics-host", "0.0.0.0"]
    ports:
      - "127.0.0.1:4840:4840"
    environment:
      MQTT_USERNAME: opcua-server
      MQTT_PASSWORD: ${MQTT_OPCUA_SERVER_PASSWORD:?run dev-secrets}
      OPCUA_SERVER_CERT: ${OPCUA_SERVER_CERT:-}
      OPCUA_SERVER_KEY: ${OPCUA_SERVER_KEY:-}
    depends_on:
      mosquitto:
        condition: service_healthy
      plc-controller:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 4840), timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api-gateway:
    <<: *python-service
    # Reached only through the web service (nginx) and from inside the network: no host
    # port. It trusts X-Forwarded-For only from private addresses, which on this network
    # means nginx or another service of the stack.
    command: ["python", "-m", "api_gateway", "--host", "0.0.0.0", "--port", "8000", "--forwarded-allow-ips", "172.16.0.0/12,10.0.0.0/8,192.168.0.0/16"]
    environment:
      MQTT_USERNAME: api-gateway
      MQTT_PASSWORD: ${MQTT_API_GATEWAY_PASSWORD:?run dev-secrets}
      DATABASE_URL: postgresql+asyncpg://cogniboiler_gateway:${GATEWAY_DB_PASSWORD:?run dev-secrets}@postgresql:5432/${POSTGRES_DB:?run dev-secrets}
      AUTO_INIT_DB: "true"
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?run dev-secrets}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?run dev-secrets}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?run dev-secrets}
      DEMO_ENGINEER_PASSWORD: ${DEMO_ENGINEER_PASSWORD:?run dev-secrets}
      DEMO_OPERATOR_PASSWORD: ${DEMO_OPERATOR_PASSWORD:?run dev-secrets}
      DEMO_VIEWER_PASSWORD: ${DEMO_VIEWER_PASSWORD:?run dev-secrets}
      PHYSICS_GRPC_TARGET: physics-engine:50052
      PLC_GRPC_TARGET: plc-controller:50051
      ALARM_GRPC_TARGET: alert-manager:50053
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUXDB_ADMIN_TOKEN:?run dev-secrets}
      INFLUX_ORG: ${INFLUXDB_ORG:?run dev-secrets}
      INFLUX_BUCKET: ${INFLUXDB_BUCKET:?run dev-secrets}
    depends_on:
      migrate:
        condition: service_completed_successfully
      mosquitto:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      physics-engine:
        condition: service_healthy
      plc-controller:
        condition: service_healthy
      alert-manager:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # The console and the gateway's public routes on one origin: HTTP on 8080 and, with the
  # certificate from .env, HTTPS on 8443. The only way in from the host besides tools.
  web:
    build:
      context: ./apps/web
      additional_contexts:
        nginx: ./infrastructure/nginx
    image: cogniboiler/web:dev
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8443:8443"
    environment:
      WEB_TLS_CERT: ${WEB_TLS_CERT:-}
      WEB_TLS_KEY: ${WEB_TLS_KEY:-}
    depends_on:
      api-gateway:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Service metrics for the Platform dashboard; `stack up` enables this profile.
  prometheus:
    image: prom/prometheus:v3.8.0
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=7d"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mosquitto_data:
  mosquitto_log:
  influxdb_data:
  influxdb_config:
  postgresql_data:
  grafana_data:
  prometheus_data:
