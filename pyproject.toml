[project]
authors = [{name = "dimbo1324", email = "dimaprihodko180@gmail.com"}]
dependencies = []
description = "AI-Driven Digital Twin Platform for steam boiler and turbine"
keywords = [
  "digital-twin",
  "industrial-iot",
  "scada",
  "machine-learning",
  "opc-ua",
]
license = {file = "LICENSE"}
name = "cogniboiler"
readme = "README.md"
requires-python = ">=3.14"
version = "0.1.0"

[tool.uv.workspace]
# apps/ai-predictor is deliberately not a member: the AI stage is deferred
# (owner decision 2026-09-14, docs/__arch__/open-questions.md).
members = [
  "apps/physics-engine",
  "apps/plc-controller",
  "apps/api-gateway",
  "apps/historian",
  "apps/alert-manager",
  "apps/opcua-server",
  "shared/observability",
  "shared/runtime",
]

[dependency-groups]
dev = [
  "pytest>=9.0.2",
  "pytest-asyncio>=1.3.0",
  "pytest-cov>=7.0.0",
  "ruff>=0.15.4",
  "mypy>=1.19.1",
  "pre-commit>=4.5.1",
  "httpx>=0.28.1",
  "grpcio-tools>=1.75.1",
]

[tool.ruff]
exclude = ["shared/generated"]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
ignore = ["E501"]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N"]

[tool.ruff.lint.per-file-ignores]
"apps/plc-controller/src/plc_controller/server.py" = ["N802"]

[tool.ruff.lint.isort]
known-first-party = ["shared"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.mypy]
exclude = [
  "(^|[\\/])shared[\\/]generated([\\/]|$)",
  "(^|[\\/])ml[\\/]datasets([\\/]|$)",
  "(^|[\\/])tests([\\/]|$)",
]
explicit_package_bases = true
files = ["apps", "shared"]
# The workspace packages are installed editable, through a .pth import hook mypy cannot
# follow: without this they resolve to Any and every call into them goes unchecked.
mypy_path = ["shared/observability/src", "shared/runtime/src"]
ignore_missing_imports = true
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
ignore_errors = true
module = ["cogniboiler_pb2", "cogniboiler_pb2_grpc"]

[tool.pytest.ini_options]
addopts = "--cov --cov-report=term-missing"
asyncio_mode = "auto"
testpaths = ["apps", "shared/observability/tests", "shared/runtime/tests"]
