# Commit-time hooks only normalise what is staged: formatting and file hygiene, with the
# tool versions pinned in uv.lock. Lint, strict typing and tests run in the quality gate
# over the whole workspace, where the project's dependencies are actually installed.
exclude: ^shared/generated/

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format (uv.lock version)
        entry: uv run --no-sync ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: debug-statements
      - id: mixed-line-ending
        args: [--fix=lf]
