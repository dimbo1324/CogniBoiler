name: Toolchain
description: >-
  uv with the Python pinned in .python-version, optionally the workspace from uv.lock,
  and optionally pnpm, Node and the console's dependencies. Actions are pinned by commit.
inputs:
  sync-python:
    description: Sync the Python workspace from uv.lock.
    default: "true"
  node:
    description: Install pnpm, Node and the console's dependencies.
    default: "true"
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        enable-cache: true

    - name: Install the Python pinned in .python-version
      shell: bash
      run: uv python install

    - name: Sync the Python workspace
      if: inputs.sync-python == 'true'
      shell: bash
      run: uv sync --all-packages --frozen

    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      if: inputs.node == 'true'
      with:
        package_json_file: apps/web/package.json

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      if: inputs.node == 'true'
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: apps/web/pnpm-lock.yaml

    - name: Install frontend dependencies
      if: inputs.node == 'true'
      shell: bash
      run: pnpm --dir apps/web install --frozen-lockfile
