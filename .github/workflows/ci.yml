name: CI

# `gate` runs the same quality gate developers run locally; `audit` checks the locked
# dependencies for known vulnerabilities; `stack` builds the images, scans them, starts the
# whole Compose stack with throwaway secrets, and runs the end-to-end smoke. The audit and
# scan reports are kept as artifacts.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install the Python pinned in .python-version
        run: uv python install

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir apps/web install --frozen-lockfile

      - name: Sync the Python workspace
        run: uv sync --all-packages --frozen

      - name: Quality gate
        run: uv run --no-sync python dev_tools_scripts_runner.py quality-gate

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install the Python pinned in .python-version
        run: uv python install

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir apps/web install --frozen-lockfile

      - name: Dependency audit (pip-audit, pnpm audit)
        run: uv run --no-project python dev_tools_scripts_runner.py audit-deps

      - name: Keep the audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: audit-reports/
          if-no-files-found: warn

  stack:
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install the Python pinned in .python-version
        run: uv python install

      - name: Sync the Python workspace
        run: uv sync --all-packages --frozen

      - name: Generate throwaway secrets
        run: uv run --no-sync python dev_tools_scripts_runner.py dev-secrets

      - name: Start the stack
        run: uv run --no-sync python dev_tools_scripts_runner.py stack up

      - name: End-to-end smoke
        run: uv run --no-sync python dev_tools_scripts_runner.py smoke

      - name: Scan the service image (Trivy)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cogniboiler/services:dev
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          output: trivy-services.txt
          exit-code: "0"

      - name: Scan the console image (Trivy)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cogniboiler/web:dev
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          output: trivy-web.txt
          exit-code: "0"

      - name: Keep the image scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-scan
          path: trivy-*.txt
          if-no-files-found: warn

      - name: Service logs on failure
        if: failure()
        run: docker compose ps --all && docker compose logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: uv run --no-sync python dev_tools_scripts_runner.py stack down --volumes --yes
