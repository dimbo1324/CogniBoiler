name: CI

# gate     — the quality gate developers run locally, with CI=true.
# audit    — known vulnerabilities in the locked dependencies (report artifact).
# stack    — builds every image, starts the whole Compose stack with throwaway secrets,
#            runs the smoke check and the console's Playwright checks through nginx, and
#            scans the images with Trivy (report artifacts).
# publish  — on `main` and on tags `v*`, after gate, audit and stack: pushes every image to
#            GitHub Container Registry as ghcr.io/<owner>/cogniboiler/<service>.
# release  — on tags `v*`, after publish: a GitHub release with generated notes and the
#            files needed to run the published images.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install the Python pinned in .python-version
        run: uv python install

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir apps/web install --frozen-lockfile

      - name: Sync the Python workspace
        run: uv sync --all-packages --frozen

      - name: Quality gate
        run: uv run --no-sync python dev_tools_scripts_runner.py quality-gate

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install the Python pinned in .python-version
        run: uv python install

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir apps/web install --frozen-lockfile

      - name: Dependency audit (pip-audit, pnpm audit)
        run: uv run --no-project python dev_tools_scripts_runner.py audit-deps

      - name: Keep the audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-audit
          path: audit-reports/
          if-no-files-found: warn

  stack:
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install the Python pinned in .python-version
        run: uv python install

      - name: Sync the Python workspace
        run: uv sync --all-packages --frozen

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install frontend dependencies and Chromium
        run: |
          pnpm --dir apps/web install --frozen-lockfile
          pnpm --dir apps/web exec playwright install --with-deps chromium

      - name: Generate throwaway secrets
        run: uv run --no-sync python dev_tools_scripts_runner.py dev-secrets

      - name: Start the stack
        run: uv run --no-sync python dev_tools_scripts_runner.py stack up

      - name: End-to-end smoke
        run: uv run --no-sync python dev_tools_scripts_runner.py smoke

      - name: Console checks (Playwright, through nginx)
        env:
          CI: "true"
        run: uv run --no-sync python dev_tools_scripts_runner.py console-e2e --no-install --url http://localhost:8080

      - name: Keep the Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright
          path: |
            apps/web/e2e-report/
            apps/web/e2e-results/
          if-no-files-found: ignore

      # Fails on a HIGH or CRITICAL finding that has a fix, after scanning every image;
      # publish needs this job, so such an image is never pushed.
      - name: Scan the images (Trivy)
        if: always()
        run: |
          mkdir -p image-scan
          status=0
          for image in physics-engine plc-controller api-gateway historian alert-manager opcua-server web; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/image-scan:/out" \
              aquasec/trivy:0.74.0 image --quiet --severity CRITICAL,HIGH --ignore-unfixed \
              --exit-code 1 --format table --output "/out/$image.txt" "cogniboiler/$image:dev" \
              || status=1
          done
          exit "$status"

      - name: Keep the image scan reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-scan
          path: image-scan/
          if-no-files-found: warn

      - name: Service logs on failure
        if: failure()
        run: docker compose --profile full ps --all && docker compose --profile full logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: uv run --no-sync python dev_tools_scripts_runner.py stack down --volumes --yes

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [gate, audit, stack]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [physics-engine, plc-controller, api-gateway, historian, alert-manager, opcua-server, web]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cogniboiler/${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}},prefix=v
            type=semver,pattern={{major}}.{{minor}},prefix=v
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-

      - name: Build and push a service image
        if: matrix.service != 'web'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.service }}
          pull: true
          no-cache-filters: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Build and push the console image
        if: matrix.service == 'web'
        uses: docker/build-push-action@v7
        with:
          context: apps/web
          build-contexts: nginx=infrastructure/nginx
          pull: true
          no-cache-filters: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          cat > release-notes.md <<NOTES
          Images: \`ghcr.io/${owner}/cogniboiler/<service>:${TAG}\` for physics-engine,
          plc-controller, api-gateway, historian, alert-manager, opcua-server and web.

          Run this release without building: clone the tag (the compose file mounts broker,
          Grafana, Prometheus and nginx configuration from the repository), then

              python dev_tools_scripts_runner.py dev-secrets
              COGNIBOILER_REGISTRY=ghcr.io/${owner}/cogniboiler COGNIBOILER_TAG=${TAG} \\
                python dev_tools_scripts_runner.py stack up --no-build
          NOTES
          gh release create "$TAG" --verify-tag --title "CogniBoiler $TAG" \
            --notes-file release-notes.md --generate-notes \
            docker-compose.yml .env.example
