[project]
name = "physics-engine"
version = "0.1.0"
description = "Thermodynamic simulation of steam boiler and turbine"
requires-python = ">=3.14"
dependencies = [
    "cogniboiler-observability",
    "numpy>=2.3.2",
    "scipy>=1.16.1",
    "pydantic>=2.12.0",
    "structlog>=24.0.0",
    "aiomqtt>=2.5.1",
    "grpcio>=1.75.1",
    "protobuf>=6.31.1",
    "iapws>=1.5.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/physics_engine"]

[tool.uv.sources]
cogniboiler-observability = { workspace = true }
