[project]
name = "plc-controller"
version = "0.1.0"
description = "Virtual PLC with cascade PID control"
requires-python = ">=3.14"
dependencies = [
    "cogniboiler-observability",
    "cogniboiler-runtime",
    "numpy>=2.3.2",
    "pydantic>=2.12.0",
    "pyyaml>=6.0.0",
    "structlog>=24.0.0",
    "grpcio>=1.75.1",
    "protobuf>=6.31.1",
    "aiomqtt>=2.5.1",
]

# The PLC talks to the plant only over gRPC; the in-process plant is a test fixture.
[dependency-groups]
dev = [
    "physics-engine",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plc_controller"]

[tool.uv.sources]
physics-engine = { workspace = true }
cogniboiler-observability = { workspace = true }
cogniboiler-runtime = { workspace = true }
