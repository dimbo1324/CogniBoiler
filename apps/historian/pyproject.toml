[project]
name = "historian"
version = "0.1.0"
description = "Time-series data recorder to InfluxDB"
requires-python = ">=3.14"
dependencies = [
    "cogniboiler-observability",
    "influxdb-client>=1.40.0",
    "aiomqtt>=2.5.1",
    "pydantic>=2.12.0",
    "structlog>=24.0.0",
    "protobuf>=6.31.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/historian"]

[tool.uv.sources]
cogniboiler-observability = { workspace = true }
