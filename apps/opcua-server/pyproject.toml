[project]
name = "opcua-server"
version = "0.1.0"
description = "OPC UA server implementing IEC 62541 for field-level integration"
requires-python = ">=3.14"
dependencies = [
    "cogniboiler-observability",
    "asyncua>=2.0.1",
    "aiomqtt>=2.5.1",
    "pydantic>=2.12.0",
    "structlog>=24.0.0",
    "protobuf>=6.31.1",
    "grpcio>=1.75.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opcua_server"]

[tool.uv.sources]
cogniboiler-observability = { workspace = true }
